name: POEM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify
      - run: go build ./cmd/gallery
      - run: go build ./cmd/engine
      - run: git diff --check

  sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - run: cmake -S cpp_sidecar -B cpp_sidecar/build
      - run: cmake --build cpp_sidecar/build --config Release
      # The embedded sidecar must have been built from the current cpp_sidecar
      # sources. The check fingerprints the committed sources (git blob hashes,
      # deterministic on any checkout) against the manifest recorded when the
      # binary was embedded. Bit-comparing the exe against a fresh runner build
      # is NOT viable: MSVC updates on the runner image change codegen, so that
      # comparison has never passed on CI (v0.1.0 and v0.3.0 both failed on it).
      - name: Verify embedded sidecar provenance
        shell: pwsh
        run: |
          $current = (git ls-files -s cpp_sidecar) -join "`n"
          $fingerprint = (Get-FileHash -InputStream ([IO.MemoryStream][Text.Encoding]::UTF8.GetBytes($current)) -Algorithm SHA256).Hash
          $manifest = (Get-Content pkg/render/assets/windows_amd64/poem_cpp_sidecar.provenance -Raw).Trim()
          if ($fingerprint -ne $manifest) { throw "cpp_sidecar sources ($fingerprint) do not match the embedded sidecar's provenance manifest ($manifest); rebuild and re-embed per RELEASING.md" }
