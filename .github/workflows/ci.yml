name: POEM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify
      - run: go build ./cmd/gallery
      - run: go build ./cmd/engine
      - run: git diff --check

  sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - run: cmake -S cpp_sidecar -B cpp_sidecar/build
      - run: cmake --build cpp_sidecar/build --config Release
      - name: Verify embedded sidecar provenance
        shell: pwsh
        run: |
          $embedded = (Get-FileHash pkg/render/assets/windows_amd64/poem_cpp_sidecar.exe -Algorithm SHA256).Hash
          $built = (Get-FileHash cpp_sidecar/build/Release/poem_cpp_sidecar.exe -Algorithm SHA256).Hash
          if ($embedded -ne $built) { throw "embedded sidecar hash $embedded does not match Release build $built" }
