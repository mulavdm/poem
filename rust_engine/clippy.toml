# AUTO-GENERATED by `workspace.exe rust sync`. Do not edit.
#
# The policy is declared once in workspace-rust.json and generated into every
# Cargo root, so nineteen repositories cannot drift apart by each remembering
# it separately. Edit the manifest and re-run sync; an edit here is reverted
# without warning, and `workspace.exe check` reports the drift meanwhile.
#
# Each setting carries the reason the repository that proved it gave.

# As allow-unwrap-in-tests, and set by the same three roots for the same
# reason.
# -- from HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterGameRPG/rust,
#    HamsterUI/rust
allow-expect-in-tests = true
# In a test the unwrap IS the assertion: rewriting it as a match that panics
# with a worse message makes the test longer and no safer, and denying it
# there trains people to reach for #[allow], which then hides the production
# cases too. Three repositories reached this independently and wrote it in
# near-identical words.
# -- from HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterGameRPG/rust,
#    HamsterUI/rust
allow-unwrap-in-tests = true
