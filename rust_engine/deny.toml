# AUTO-GENERATED by `workspace.exe rust sync`. Do not edit.
#
# The policy is declared once in workspace-rust.json and generated into every
# Cargo root, so nineteen repositories cannot drift apart by each remembering
# it separately. Edit the manifest and re-run sync; an edit here is reverted
# without warning, and `workspace.exe check` reports the drift meanwhile.
#
# Each setting carries the reason the repository that proved it gave.

[advisories]
# A known vulnerability or unsound crate fails the gate. Yanked versions are
# worth knowing about but are not, on their own, a reason to block a build.
# Five roots wrote this independently in near-identical words.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust
yanked = "warn"
# Empty is the intended resting state, not a gap. Unmaintained advisories
# are listed individually, never switched off as a class: a newly
# unmaintained dependency should fail this gate and force a decision instead
# of blending into a warning stream. HamsterUI adds the other half of the
# discipline -- an exemption is deleted when the dependency that needed it
# leaves the tree, not left behind as inert history.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust
ignore = [
    # paste -- recorded 2026-08-21T00:00:00Z -- fix: migrate to pastey
    # revisit when: `paste` leaves the tree, or a direct dependent offers a
    # pastey-based release. Both crates are in the tree today and Phase 1's
    # S4 signal flags them as one edit apart, so a migration must be read as
    # deliberate rather than as the typosquat it resembles.
    "RUSTSEC-2024-0436",
    # quick-xml -- recorded 2026-08-21T00:00:00Z -- fix: upgrade quick-xml
    # revisit when: POEM/rust_engine bumps quick-xml. It is the only root
    # that locks it, so this is one repository's dependency bump under its
    # own gates and needs no coordination.
    "RUSTSEC-2026-0194",
    # quick-xml -- recorded 2026-08-21T00:00:00Z -- fix: upgrade quick-xml
    # revisit when: POEM/rust_engine bumps quick-xml -- the same bump that
    # closes RUSTSEC-2026-0194, so both entries are deleted in one edit.
    "RUSTSEC-2026-0195",
    # memmap2 -- recorded 2026-08-21T00:00:00Z -- fix: upgrade memmap2
    # revisit when: POEM/rust_engine bumps memmap2. Only root that locks it.
    "RUSTSEC-2026-0186",
    # ttf-parser -- recorded 2026-08-21T00:00:00Z -- fix: upgrade ttf-parser
    # revisit when: POEM/rust_engine's font stack moves off ttf-parser.
    # HamsterUI already closed this one by taking HarfRust for shaping and
    # skrifa for scaling, and recorded that in its deny.toml -- the
    # remediation path exists in this workspace and does not need
    # rediscovering.
    "RUSTSEC-2026-0192",
]

[licenses]
# Permissive licences plus MPL-2.0, which is file-level copyleft that does
# not reach our code. Assembled 2026-08-21 from all six declared lists and
# checked against every crate in all 19 graphs. An allow-list states what
# the workspace accepts in advance, so a crate pulled in next year either
# conforms or stops the gate; it is not an inventory of what is in use
# today. LGPL-2.1-or-later is deliberately absent: r-efi carries it and
# appears in 12 roots' listings, but it is UEFI-target-gated and a target
# filter is the precise tool for that, not an entry here.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust, ManuscriptAuditore
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# First-party crates declare `publish = false` and carry no licence field, so they
# are ignored here rather than being given a fictional SPDX expression.
private = { ignore = true }

[bans]
# Warn rather than deny: duplicate majors are worth seeing and are routinely
# outside a consumer's control. All six roots that declared a policy chose
# warn.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust, ManuscriptAuditore
multiple-versions = "warn"
# A wildcard registry dependency pins nothing. All six roots deny it.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust, ManuscriptAuditore
wildcards = "deny"
# Path dependencies between first-party crates are the intended shape; only
# wildcard *registry* dependencies are forbidden.
# -- from HamsterWorld/rust, ManuscriptAuditore
allow-wildcard-paths = true
# When a duplicate version is reported, show every path that pulled it in
# rather than the first. `multiple-versions = "warn"` makes duplicates a
# report instead of a failure, and a report nobody can act on is one people
# learn to skip: without the full graph the reader knows a crate is
# duplicated but not which dependency to bump. Five roots set it, none of
# them writing a reason down -- this one is reconstructed from what the
# setting does and from the `multiple-versions` rationale they did write,
# and is the harvest's one inferred entry.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust
highlight = "all"

[sources]
# Only crates.io. A second registry is a second trust boundary and arrives
# silently.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust, ManuscriptAuditore
unknown-registry = "deny"
# A git dependency has no publication date and no owner set, so the
# admission signals cannot evaluate it. All six roots deny it.
# -- from HamsterUI/rust, HamsterWorld/rust,
#    HamsterSuite/HamsterEngine/rust, HamsterSuite/HamsterEditor/rust,
#    HamsterSuite/HamsterGameRPG/rust, ManuscriptAuditore
unknown-git = "deny"
