[package]
name = "poem_rust_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29", features = ["rwh_06"] }
wgpu = "0.19"
rodio = "0.17"
flatbuffers = "25.12.19"
bytemuck = { version = "1.16", features = ["derive"] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security"
]}
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
